# Static Astro site — no @astrojs/cloudflare adapter.
# Lets `npx wrangler deploy` upload ./dist without auto-running `astro add cloudflare`.
name = "blog"

# Pin to a date supported by Cloudflare's build-image workerd.
# (Auto-setup used "today" 2026-08-12 and failed when the binary only supported through 2026-08-11.)
compatibility_date = "2026-08-11"

[assets]
directory = "./dist"
not_found_handling = "404-page"
